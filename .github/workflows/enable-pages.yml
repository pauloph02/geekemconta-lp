name: Enable GitHub Pages

# One-shot configuration: Deploy from a branch, branch main, folder / (root).
# The site itself is static HTML/CSS and does not use this workflow to build.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write
  contents: read

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Configure Pages source to main /
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          payload='{"build_type":"legacy","source":{"branch":"main","path":"/"}}'
          auth=(-H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28")

          code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" -X POST "${auth[@]}" \
            "https://api.github.com/repos/${repo}/pages" -d "$payload")
          echo "create HTTP ${code}"
          cat /tmp/pages.json
          echo

          if [ "$code" != "201" ]; then
            code=$(curl -sS -o /tmp/pages-put.json -w "%{http_code}" -X PUT "${auth[@]}" \
              "https://api.github.com/repos/${repo}/pages" -d "$payload")
            echo "update HTTP ${code}"
            cat /tmp/pages-put.json
            echo
          fi

          if [ "$code" != "201" ] && [ "$code" != "204" ]; then
            echo "Could not set Pages to deploy from branch main /"
            exit 1
          fi

          build_code=$(curl -sS -o /tmp/build.json -w "%{http_code}" -X POST "${auth[@]}" \
            "https://api.github.com/repos/${repo}/pages/builds")
          echo "build HTTP ${build_code}"
          cat /tmp/build.json
          echo

          echo "Pages site:"
          curl -sS "${auth[@]}" "https://api.github.com/repos/${repo}/pages"
          echo
